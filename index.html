    <meta name="description" content="Discover luxury women’s clothing designed in London. Shop elegant long dresses, trendy tops, kurtis, and chic abayas. Free shipping over £75." />
    <meta name="keywords" content="women’s luxury dresses, kurtis, abayas, tops, London design, modest fashion, elegant womenswear" />
    
    <!-- OpenGraph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AFW LUXE | London-Designed Luxury Womenswear" />
    <meta property="og:description" content="Discover luxury women’s clothing designed in London. Shop elegant long dresses, trendy tops, kurtis, and chic abayas. Free shipping over £75." />

    <!-- Google Fonts: Plus Jakarta Sans with Apple system typography fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "AFW LUXE",
      "description": "London-designed luxury womenswear for the modern, elegant, modest woman.",
      "currenciesAccepted": "GBP, USD, EUR, AED",
      "paymentAccepted": "Credit Card, Apple Pay, Klarna",
      "priceRange": "££-£££",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "London",
        "addressCountry": "GB"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "AFW LUXE Collections",
        "itemListElement": [
          {
            "@type": "OfferCatalog",
            "name": "Dresses",
            "description": "Elegant long dresses for every occasion"
          },
          {
            "@type": "OfferCatalog",
            "name": "Kurtis",
            "description": "Timeless kurtis with a contemporary twist"
          },
          {
            "@type": "OfferCatalog",
            "name": "Abayas",
            "description": "Chic abayas blending modesty and luxury"
          },
          {
            "@type": "OfferCatalog",
            "name": "Tops",
            "description": "Trendy tops designed for effortless style"
          }
        ]
      }
    }
    </script>
  </head>
  <body class="bg-[#FDFCF7] text-[#1C1C1C] antialiased selection:bg-[#C4A468]/30 selection:text-[#1C1C1C]">
