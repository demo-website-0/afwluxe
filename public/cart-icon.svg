<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <!-- Wheels: Hollow rings -->
  <circle cx="88" cy="436" r="38" stroke-width="28" fill="none" />
  <circle cx="424" cy="436" r="38" stroke-width="28" fill="none" />

  <!-- Bottom Connecting Bar between the two wheels -->
  <line x1="126" y1="436" x2="386" y2="436" stroke-width="28" />

  <!-- Rear Wheel Strut -->
  <line x1="112" y1="344" x2="96" y2="398" stroke-width="28" />

  <!-- Handle (angled top-left) -->
  <polyline points="24,44 74,74 112,344" stroke-width="28" stroke-linecap="round" />

  <!-- Basket Outer Rim (slanted trapezoid) -->
  <polygon points="86,114 492,146 436,344 112,344" stroke-width="28" fill="none" />

  <!-- 3 Inner Horizontal Grid Bars -->
  <line x1="93" y1="172" x2="478" y2="196" stroke-width="20" />
  <line x1="99" y1="229" x2="464" y2="245" stroke-width="20" />
  <line x1="106" y1="287" x2="450" y2="295" stroke-width="20" />

  <!-- 4 Inner Vertical Grid Bars -->
  <line x1="167" y1="120" x2="177" y2="344" stroke-width="20" />
  <line x1="248" y1="127" x2="242" y2="344" stroke-width="20" />
  <line x1="329" y1="133" x2="307" y2="344" stroke-width="20" />
  <line x1="411" y1="140" x2="372" y2="344" stroke-width="20" />
</svg>